name: Cloud Voting App CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Voting App
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/voting-app:latest \
          ./voting-app

      - name: Build Results App
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/results-app:latest \
          ./results-app

      - name: Push Voting App
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/voting-app:latest

      - name: Push Results App
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/results-app:latest
